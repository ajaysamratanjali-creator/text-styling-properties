<!DOCTYPE html>
<html>
    <head>
        <title> My Superhero webpage</title>
        <style>
            body {
                background-color: Brown;
                color: black;
                font-family: sans-serif;
            }

            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange;
            }
            
            .tagline {
                font-style: italic;
                color: Lightblue;
                text-transform: capitalize;
            }

            .labels {
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
            }

            .power {
                font-weight: bold;
                color: lightblue;
            }

            .weaknesses {
                text-decoration: line-through;
                color:grey;
            }

            .badge {
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(80deg)
            }

            .made-by {
                color: coral;
                font-style: italic;
            }
        </style>
    </head>

    <body>
        <h1 class="hero-name">Thor</h1>
        <p class="tagline">The most powerful hero in the world.</p>

        <h2 class="labels">super powers</h2>
        <p class="power">Can run faster than a cheetah</p>
        <p class="power">Can lift a school bus</p>
        <p class="power">Can lift heavy things</p>

        <h2 class="label">Weaknesses</h2>
        <p class="weaknesses">Broken hammer</p>
        <p class="weaknesses">Broken axe</p>

        <p class="badge">Top Hero</p>

        <p class="made-by">Created/made by Samrat C.</p>
    </body>
</html>
